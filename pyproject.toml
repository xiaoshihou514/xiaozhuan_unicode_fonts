[project]
name = "xiaozhuan-unicode-fonts"
version = "0.1.4"
description = "說文解字小篆四家字形复现管线（Unicode 18.0 U+3D000–3FC3F，仅供研究）"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "fonttools>=4.55",
    "pymupdf>=1.24",
    "skia-pathops>=0.9.2",
]

[project.scripts]
xiaozhuan-fonts = "xiaozhuan_unicode_fonts.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
